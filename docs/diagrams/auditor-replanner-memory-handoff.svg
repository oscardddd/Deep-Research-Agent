<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Auditor to Replanner Memory Handoff</title>
  <desc>A real round-one example showing how the Auditor writes working state, context construction reads working state and research.sqlite, and the Replanner receives one bounded request.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3975D7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#24A46D"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C5CDA"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E28A20"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#F7F8FC"/>

  <text x="58" y="58" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">How Memory Connects Auditor → Replanner</text>
  <text x="58" y="94" font-family="Inter, Arial, sans-serif" font-size="18" fill="#667085">Real Round 1 example · Agents do not talk directly; state + durable evidence are compiled into one bounded request.</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="58" y="120" width="156" height="30" rx="15" fill="#EAF2FF"/>
    <circle cx="78" cy="135" r="6" fill="#3975D7"/>
    <text x="92" y="140" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5FAE">WORKING STATE</text>
    <rect x="226" y="120" width="170" height="30" rx="15" fill="#E7F7EF"/>
    <circle cx="246" cy="135" r="6" fill="#24A46D"/>
    <text x="260" y="140" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#237A54">DURABLE MEMORY</text>
    <rect x="408" y="120" width="116" height="30" rx="15" fill="#F1ECFF"/>
    <path d="M428 129 L436 135 L428 141" fill="none" stroke="#7C5CDA" stroke-width="2"/>
    <text x="446" y="140" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6849BA">PROCESS</text>
    <rect x="536" y="120" width="154" height="30" rx="15" fill="#FFF2DD"/>
    <circle cx="556" cy="135" r="6" fill="#E28A20"/>
    <text x="570" y="140" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#A75C0B">MODEL CONTEXT</text>
  </g>

  <!-- Auditor -->
  <g id="auditor" filter="url(#shadow)">
    <rect x="58" y="188" width="240" height="220" rx="20" fill="#FFFFFF"/>
    <rect x="58" y="188" width="240" height="68" rx="20" fill="#172033"/>
    <rect x="58" y="236" width="240" height="20" fill="#172033"/>
  </g>
  <circle cx="92" cy="222" r="18" fill="#FFFFFF" fill-opacity="0.14"/>
  <path d="M84 222 L90 228 L101 215" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="218" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Auditor</text>
  <text x="120" y="241" font-family="Inter, Arial, sans-serif" font-size="13" fill="#D0D5DD">Evidence sufficiency check</text>
  <text x="84" y="292" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">OUTPUT</text>
  <text x="84" y="322" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">AuditResult</text>
  <text x="84" y="350" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">sufficient = false</text>
  <text x="84" y="376" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">2 high-priority gaps</text>
  <text x="84" y="396" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085">No direct message to Planner</text>

  <!-- Working State -->
  <g id="working-state" filter="url(#shadow)">
    <rect x="350" y="172" width="336" height="330" rx="20" fill="#FFFFFF"/>
    <path d="M370 172 H666 Q686 172 686 192 V236 H350 V192 Q350 172 370 172 Z" fill="#EAF2FF"/>
    <rect x="350" y="172" width="7" height="330" rx="3.5" fill="#3975D7"/>
  </g>
  <text x="380" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#2F5FAE">SYSTEM WORKING MEMORY</text>
  <text x="380" y="226" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">GraphState + Checkpoint</text>

  <text x="380" y="268" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">AUDITOR WRITES</text>
  <rect x="380" y="284" width="276" height="84" rx="10" fill="#F5F8FF"/>
  <text x="396" y="308" font-family="SFMono-Regular, Menlo, monospace" font-size="13" fill="#2F5FAE">audit.sufficient: false</text>
  <text x="396" y="331" font-family="SFMono-Regular, Menlo, monospace" font-size="13" fill="#2F5FAE">gap A1-G1: diverse-task metrics</text>
  <text x="396" y="354" font-family="SFMono-Regular, Menlo, monospace" font-size="13" fill="#2F5FAE">gap A1-G5: bias/privacy risk</text>

  <text x="380" y="400" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">REPLAN NODE READS</text>
  <text x="380" y="428" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">run_id · question · plan · latest audit</text>
  <text x="380" y="452" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">task_statuses: T1 partial; T2–T6 succeeded</text>
  <text x="380" y="476" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">worker_results · follow_up_round = 0</text>

  <!-- Durable Memory -->
  <g id="durable-memory" filter="url(#shadow)">
    <rect x="350" y="548" width="336" height="330" rx="20" fill="#FFFFFF"/>
    <path d="M370 548 H666 Q686 548 686 568 V612 H350 V568 Q350 548 370 548 Z" fill="#E7F7EF"/>
    <rect x="350" y="548" width="7" height="330" rx="3.5" fill="#24A46D"/>
  </g>
  <text x="380" y="578" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#237A54">DURABLE MEMORY</text>
  <text x="380" y="602" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">research.sqlite</text>

  <text x="380" y="642" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">ROUND 1 SNAPSHOT</text>
  <text x="380" y="670" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">272 assessed Evidence · 64 unique URLs</text>
  <text x="380" y="694" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">sources · evidence · assessments · audits</text>

  <rect x="380" y="718" width="276" height="126" rx="10" fill="#F3FBF7"/>
  <text x="396" y="742" font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#237A54">ev_6bad045d…</text>
  <text x="396" y="765" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">“High-loss selection is more data</text>
  <text x="396" y="784" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">efficient on GSM8k…”</text>
  <text x="396" y="810" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#237A54">tier: B · quality: 12 · fitness: 12</text>
  <text x="396" y="832" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#237A54">task: T1 · relevance: high</text>

  <!-- Context Construction -->
  <g id="context-construction" filter="url(#shadow)">
    <rect x="746" y="172" width="424" height="706" rx="24" fill="#FFFFFF" stroke="#7C5CDA" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="790" y="146" width="336" height="52" rx="26" fill="#7C5CDA"/>
  </g>
  <text x="958" y="179" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">CONTEXT CONSTRUCTION</text>
  <rect x="860" y="218" width="196" height="30" rx="15" fill="#F1ECFF"/>
  <text x="958" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#6849BA">PROCESS · NOT MEMORY</text>

  <g id="context-steps">
    <circle cx="792" cy="288" r="17" fill="#F1ECFF"/>
    <text x="792" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">1</text>
    <text x="822" y="285" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Load by run_id</text>
    <text x="822" y="307" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">Read audit controls + all candidate Evidence</text>

    <line x1="792" y1="320" x2="792" y2="347" stroke="#D6CCFA" stroke-width="2"/>
    <circle cx="792" cy="366" r="17" fill="#F1ECFF"/>
    <text x="792" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">2</text>
    <text x="822" y="363" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Curate corpus</text>
    <text x="822" y="385" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">Quality policy + max 4 Evidence/source</text>
    <rect x="994" y="350" width="132" height="28" rx="14" fill="#F1ECFF"/>
    <text x="1060" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6849BA">272 → 178</text>

    <line x1="792" y1="398" x2="792" y2="425" stroke="#D6CCFA" stroke-width="2"/>
    <circle cx="792" cy="444" r="17" fill="#F1ECFF"/>
    <text x="792" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">3</text>
    <text x="822" y="441" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Build ResearchStateDigest</text>
    <text x="822" y="463" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">6 worker summaries · claims · gaps · source risks</text>

    <line x1="792" y1="476" x2="792" y2="503" stroke="#D6CCFA" stroke-width="2"/>
    <circle cx="792" cy="522" r="17" fill="#F1ECFF"/>
    <text x="792" y="528" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">4</text>
    <text x="822" y="519" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Select drill-down slice</text>
    <text x="822" y="541" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">Top 3 gaps · task match · provenance diversity</text>
    <rect x="994" y="506" width="132" height="28" rx="14" fill="#F1ECFF"/>
    <text x="1060" y="525" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6849BA">32 selected</text>

    <line x1="792" y1="554" x2="792" y2="581" stroke="#D6CCFA" stroke-width="2"/>
    <circle cx="792" cy="600" r="17" fill="#F1ECFF"/>
    <text x="792" y="606" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">5</text>
    <text x="822" y="597" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Compress + apply token budget</text>
    <text x="822" y="619" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">Excerpt ≤ 600 chars · Replan budget 24k</text>

    <line x1="792" y1="632" x2="792" y2="659" stroke="#D6CCFA" stroke-width="2"/>
    <circle cx="792" cy="678" r="17" fill="#F1ECFF"/>
    <text x="792" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6849BA">6</text>
    <text x="822" y="675" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Save digest + assemble request</text>
    <text x="822" y="697" font-family="Inter, Arial, sans-serif" font-size="13" fill="#667085">Persist digest; package only fields Replanner needs</text>
  </g>

  <rect x="780" y="730" width="356" height="116" rx="12" fill="#F7F5FF"/>
  <text x="800" y="754" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#6849BA">COMPILED HANDOFF</text>
  <text x="800" y="780" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#475467">audit_handoff: sufficient + actionable_gaps</text>
  <text x="800" y="802" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#475467">research_digest + 32 drilldown Evidence</text>
  <text x="800" y="824" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#475467">statuses + risks + round: 1 + max_tasks: 3</text>

  <!-- Replanner + request context -->
  <g id="replanner" filter="url(#shadow)">
    <rect x="1228" y="188" width="314" height="186" rx="20" fill="#FFFFFF"/>
    <rect x="1228" y="188" width="314" height="66" rx="20" fill="#172033"/>
    <rect x="1228" y="234" width="314" height="20" fill="#172033"/>
  </g>
  <circle cx="1262" cy="221" r="18" fill="#FFFFFF" fill-opacity="0.14"/>
  <path d="M1255 229 L1262 212 L1269 229 M1258 222 H1266" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1290" y="218" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Replanner</text>
  <text x="1290" y="241" font-family="Inter, Arial, sans-serif" font-size="13" fill="#D0D5DD">Planner model · replan()</text>
  <text x="1256" y="286" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">DECIDES</text>
  <text x="1256" y="314" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">Is another research wave useful?</text>
  <text x="1256" y="338" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475467">Which new tasks close the gaps?</text>
  <text x="1256" y="362" font-family="Inter, Arial, sans-serif" font-size="12" fill="#667085">No direct access to GraphState or SQLite</text>

  <g id="model-context" filter="url(#shadow)">
    <rect x="1228" y="424" width="314" height="248" rx="20" fill="#FFFFFF"/>
    <path d="M1248 424 H1522 Q1542 424 1542 444 V486 H1228 V444 Q1228 424 1248 424 Z" fill="#FFF2DD"/>
    <rect x="1228" y="424" width="7" height="248" rx="3.5" fill="#E28A20"/>
  </g>
  <text x="1256" y="454" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#A75C0B">MODEL WORKING MEMORY</text>
  <text x="1256" y="478" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">One isolated LLM request</text>
  <text x="1256" y="518" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">Question + current Plan</text>
  <text x="1256" y="542" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">2 high-priority Audit gaps</text>
  <text x="1256" y="566" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">6-worker digest + 32 Evidence payloads</text>
  <text x="1256" y="590" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">Task statuses + source risks + round 1</text>
  <line x1="1256" y1="612" x2="1514" y2="612" stroke="#E5E7EB"/>
  <text x="1256" y="640" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#A75C0B">Transient · rebuilt for this call only</text>

  <g id="replan-output" filter="url(#shadow)">
    <rect x="1228" y="724" width="314" height="154" rx="18" fill="#FFFFFF"/>
    <rect x="1228" y="724" width="7" height="154" rx="3.5" fill="#E28A20"/>
  </g>
  <text x="1256" y="752" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#98A2B3">REPLAN DECISION · ACTUAL OUTPUT</text>
  <text x="1256" y="780" font-family="SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#172033">should_continue: true</text>
  <text x="1256" y="806" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">T7 · code/dialogue/multilingual metrics</text>
  <text x="1256" y="830" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475467">T8 · bias amplification evidence</text>
  <text x="1256" y="854" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#667085">unresolved: A1-G1, A1-G5</text>

  <!-- Main arrows -->
  <path d="M298 298 H338" fill="none" stroke="#3975D7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="318" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5FAE">WRITE</text>

  <path d="M686 336 H734" fill="none" stroke="#3975D7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="710" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F5FAE">READ</text>

  <path d="M686 712 H734" fill="none" stroke="#24A46D" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="710" y="696" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#237A54">READ</text>

  <path d="M1170 548 H1216" fill="none" stroke="#7C5CDA" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="1193" y="530" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6849BA">BUILD</text>

  <path d="M1385 424 V386" fill="none" stroke="#E28A20" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="1404" y="406" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#A75C0B">CALL</text>

  <path d="M1385 374 V710" fill="none" stroke="#E28A20" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="1404" y="704" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#A75C0B">RETURN</text>

  <!-- Feedback writes -->
  <path d="M1228 840 H1168 V930 H520 V890" fill="none" stroke="#3975D7" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <text x="836" y="952" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2F5FAE">Update State: append T7/T8 · set pending · follow_up_round = 1 · dispatch workers</text>

  <path d="M1228 820 H1192 V910 H612 V890" fill="none" stroke="#24A46D" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>
  <text x="900" y="902" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#237A54">Persist: research_digest · tasks T7/T8 · operation request/response cache</text>

  <text x="58" y="982" font-family="Inter, Arial, sans-serif" font-size="14" fill="#667085">The communication contract is explicit: Auditor writes gaps → Python policies select memory → Replanner sees a bounded payload → structured output updates both memories.</text>
</svg>
