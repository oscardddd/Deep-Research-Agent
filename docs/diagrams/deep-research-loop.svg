<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#17213A" flood-opacity="0.08"/>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#17213A" flood-opacity="0.10"/>
    </filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9V1Z" fill="#3978FF"/>
    </marker>
    <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9V1Z" fill="#7C5CFC"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#F6F8FC"/>
  <circle cx="1500" cy="28" r="230" fill="#EDF3FF"/>
  <circle cx="65" cy="895" r="260" fill="#F0EDFF"/>

  <g id="header" font-family="Inter, Arial, sans-serif">
    <text x="70" y="62" fill="#3978FF" font-size="17" font-weight="750" letter-spacing="2.2">RESEARCH FLOW · TWO LEVELS OF ADAPTATION</text>
    <text x="70" y="118" fill="#101828" font-size="42" font-weight="780">Two loops correct uncertainty at different scales</text>
    <text x="70" y="153" fill="#667085" font-size="19">Read each loop independently; the left changes one worker’s next action, the right changes the research plan.</text>
  </g>

  <g id="inner-loop-card" font-family="Inter, Arial, sans-serif">
    <rect x="65" y="188" width="710" height="652" rx="30" fill="white" stroke="#D5E2FF" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="94" y="214" width="270" height="38" rx="19" fill="#EAF1FF"/>
    <circle cx="117" cy="233" r="7" fill="#3978FF"/>
    <text x="135" y="240" fill="#2862D7" font-size="15" font-weight="780" letter-spacing="1">INNER LOOP · ONE WORKER</text>
    <text x="94" y="291" fill="#101828" font-size="28" font-weight="780">Close a local evidence gap</text>

    <g id="inner-ring" stroke="#3978FF" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#blueArrow)">
      <path d="M445 349C497 362 535 390 554 424"/>
      <path d="M554 470C532 511 497 535 445 548"/>
      <path d="M349 548C298 535 263 511 241 470"/>
      <path d="M241 424C260 390 298 362 349 349"/>
    </g>

    <g id="inner-center">
      <circle cx="397" cy="448" r="82" fill="#F2F6FF" stroke="#C9D9FF" stroke-width="2"/>
      <text x="397" y="430" fill="#667085" font-size="12" font-weight="750" letter-spacing="1.4" text-anchor="middle">WORKER STATE</text>
      <text x="397" y="461" fill="#101828" font-size="21" font-weight="780" text-anchor="middle">Evidence gap</text>
      <text x="397" y="489" fill="#2862D7" font-size="12" font-weight="750" text-anchor="middle">SEARCH · FOLLOW · STOP</text>
    </g>

    <g id="inner-nodes" filter="url(#nodeShadow)">
      <g>
        <rect x="320" y="316" width="154" height="62" rx="18" fill="white" stroke="#8DB2FF" stroke-width="2.3"/>
        <circle cx="351" cy="347" r="17" fill="#EAF1FF"/>
        <text x="351" y="353" fill="#2862D7" font-size="14" font-weight="800" text-anchor="middle">01</text>
        <text x="378" y="354" fill="#101828" font-size="17" font-weight="760">Formulate</text>
      </g>
      <g>
        <rect x="520" y="417" width="182" height="62" rx="18" fill="white" stroke="#8DB2FF" stroke-width="2.3"/>
        <circle cx="551" cy="448" r="17" fill="#EAF1FF"/>
        <text x="551" y="454" fill="#2862D7" font-size="14" font-weight="800" text-anchor="middle">02</text>
        <text x="578" y="442" fill="#101828" font-size="16" font-weight="760">Search /</text>
        <text x="578" y="463" fill="#101828" font-size="16" font-weight="760">Follow</text>
      </g>
      <g>
        <rect x="310" y="518" width="174" height="62" rx="18" fill="white" stroke="#8DB2FF" stroke-width="2.3"/>
        <circle cx="341" cy="549" r="17" fill="#EAF1FF"/>
        <text x="341" y="555" fill="#2862D7" font-size="14" font-weight="800" text-anchor="middle">03</text>
        <text x="368" y="543" fill="#101828" font-size="16" font-weight="760">Assess +</text>
        <text x="368" y="564" fill="#101828" font-size="16" font-weight="760">Extract</text>
      </g>
      <g>
        <path d="M210 401L271 448L210 495L149 448L210 401Z" fill="white" stroke="#3978FF" stroke-width="2.3"/>
        <text x="210" y="444" fill="#101828" font-size="17" font-weight="760" text-anchor="middle">Decide</text>
        <text x="210" y="465" fill="#667085" font-size="11" text-anchor="middle">next action</text>
      </g>
    </g>

    <g id="inner-explanation">
      <line x1="94" y1="610" x2="746" y2="610" stroke="#E4E7EC" stroke-width="2"/>
      <text x="94" y="649" fill="#2862D7" font-size="14" font-weight="800" letter-spacing="1">WHAT HAPPENS</text>
      <text x="94" y="686" fill="#101828" font-size="15" font-weight="760">Purpose</text>
      <text x="195" y="686" fill="#667085" font-size="15">Close one task’s evidence gap.</text>
      <text x="94" y="724" fill="#101828" font-size="15" font-weight="760">One turn</text>
      <text x="195" y="724" fill="#667085" font-size="15">Formulate → retrieve → assess and extract → decide.</text>
      <text x="94" y="762" fill="#101828" font-size="15" font-weight="760">Exit</text>
      <text x="195" y="762" fill="#667085" font-size="15">STOP when sufficient, saturated, blocked, or step-limited.</text>
      <rect x="94" y="786" width="212" height="32" rx="16" fill="#E7F8F1"/>
      <text x="200" y="807" fill="#11795B" font-size="13" font-weight="760" text-anchor="middle">STOP → WORKER RESULT</text>
    </g>
  </g>

  <g id="outer-loop-card" font-family="Inter, Arial, sans-serif">
    <rect x="825" y="188" width="710" height="652" rx="30" fill="white" stroke="#DED7FF" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="854" y="214" width="306" height="38" rx="19" fill="#EEE9FF"/>
    <circle cx="877" cy="233" r="7" fill="#7C5CFC"/>
    <text x="895" y="240" fill="#6044D8" font-size="15" font-weight="780" letter-spacing="1">OUTER LOOP · RESEARCH RUN</text>
    <text x="854" y="291" fill="#101828" font-size="28" font-weight="780">Close a global coverage gap</text>

    <g id="outer-ring" stroke="#7C5CFC" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#violetArrow)">
      <path d="M1205 349C1257 362 1295 390 1314 424"/>
      <path d="M1314 470C1292 511 1257 535 1205 548"/>
      <path d="M1109 548C1058 535 1023 511 1001 470"/>
      <path d="M1001 424C1020 390 1058 362 1109 349"/>
    </g>

    <g id="outer-center">
      <circle cx="1157" cy="448" r="82" fill="#F6F3FF" stroke="#D8D0FF" stroke-width="2"/>
      <text x="1157" y="430" fill="#667085" font-size="12" font-weight="750" letter-spacing="1.4" text-anchor="middle">RESEARCH STATE</text>
      <text x="1157" y="461" fill="#101828" font-size="21" font-weight="780" text-anchor="middle">Coverage gaps</text>
      <text x="1157" y="489" fill="#6044D8" font-size="12" font-weight="750" text-anchor="middle">PASS · FAIL · REPLAN</text>
    </g>

    <g id="outer-nodes" filter="url(#nodeShadow)">
      <g>
        <rect x="1058" y="316" width="198" height="62" rx="18" fill="white" stroke="#B9AAFF" stroke-width="2.3"/>
        <circle cx="1089" cy="347" r="17" fill="#EEE9FF"/>
        <text x="1089" y="353" fill="#6044D8" font-size="14" font-weight="800" text-anchor="middle">01</text>
        <text x="1116" y="354" fill="#101828" font-size="17" font-weight="760">Parallel workers</text>
      </g>
      <g>
        <rect x="1280" y="417" width="182" height="62" rx="18" fill="white" stroke="#B9AAFF" stroke-width="2.3"/>
        <circle cx="1311" cy="448" r="17" fill="#EEE9FF"/>
        <text x="1311" y="454" fill="#6044D8" font-size="14" font-weight="800" text-anchor="middle">02</text>
        <text x="1338" y="454" fill="#101828" font-size="17" font-weight="760">Aggregate</text>
      </g>
      <g>
        <path d="M1157 510L1232 549L1157 588L1082 549L1157 510Z" fill="white" stroke="#7C5CFC" stroke-width="2.3"/>
        <text x="1157" y="545" fill="#101828" font-size="16" font-weight="760" text-anchor="middle">Audit + gates</text>
        <text x="1157" y="565" fill="#667085" font-size="11" text-anchor="middle">satisfied?</text>
      </g>
      <g>
        <rect x="872" y="417" width="182" height="62" rx="18" fill="white" stroke="#B9AAFF" stroke-width="2.3"/>
        <circle cx="903" cy="448" r="17" fill="#EEE9FF"/>
        <text x="903" y="454" fill="#6044D8" font-size="14" font-weight="800" text-anchor="middle">04</text>
        <text x="930" y="454" fill="#101828" font-size="17" font-weight="760">Replan</text>
      </g>
    </g>

    <g id="outer-explanation">
      <line x1="854" y1="610" x2="1506" y2="610" stroke="#E4E7EC" stroke-width="2"/>
      <text x="854" y="649" fill="#6044D8" font-size="14" font-weight="800" letter-spacing="1">WHAT HAPPENS</text>
      <text x="854" y="686" fill="#101828" font-size="15" font-weight="760">Purpose</text>
      <text x="955" y="686" fill="#667085" font-size="15">Close gaps across the full research run.</text>
      <text x="854" y="724" fill="#101828" font-size="15" font-weight="760">One turn</text>
      <text x="955" y="724" fill="#667085" font-size="15">Fan out → aggregate → audit gates → targeted replan.</text>
      <text x="854" y="762" fill="#101828" font-size="15" font-weight="760">Exit</text>
      <text x="955" y="762" fill="#667085" font-size="15">PASS reports; FAIL with rounds remaining starts a new wave.</text>
      <rect x="854" y="786" width="154" height="32" rx="16" fill="#E7F8F1"/>
      <text x="931" y="807" fill="#11795B" font-size="13" font-weight="760" text-anchor="middle">PASS → REPORT</text>
      <rect x="1020" y="786" width="192" height="32" rx="16" fill="#EEE9FF"/>
      <text x="1116" y="807" fill="#6044D8" font-size="13" font-weight="760" text-anchor="middle">FAIL → NEXT WAVE</text>
    </g>
  </g>
</svg>
