<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #0F172A; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #64748B; }
      .layer-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-body { font-size: 13px; fill: #475569; }
      .micro { font-size: 12px; fill: #64748B; }
      .label { font-size: 13px; font-weight: 700; }
      .layer { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 18; }
      .node { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .blue-node { fill: #EFF6FF; stroke: #60A5FA; }
      .orange-node { fill: #FFF7ED; stroke: #FB923C; }
      .purple-node { fill: #F5F3FF; stroke: #A78BFA; }
      .green-node { fill: #ECFDF5; stroke: #34D399; }
      .gray-node { fill: #F8FAFC; stroke: #CBD5E1; }
      .neutral-edge { fill: none; stroke: #64748B; stroke-width: 2; marker-end: url(#arrow-neutral); }
      .blue-edge { fill: none; stroke: #2563EB; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .orange-edge { fill: none; stroke: #EA580C; stroke-width: 3; marker-end: url(#arrow-orange); }
      .purple-edge { fill: none; stroke: #7C3AED; stroke-width: 3; marker-end: url(#arrow-purple); }
      .green-edge { fill: none; stroke: #059669; stroke-width: 2.6; marker-end: url(#arrow-green); }
      .support-edge { fill: none; stroke: #94A3B8; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow-neutral); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#F8FAFC"/>

  <g id="header">
    <text x="70" y="56" class="title">Evidence-First Deep Research — System Architecture</text>
    <text x="70" y="86" class="subtitle">Control plane owns the loops; runtime executes bounded side effects; durable stores keep every wave resumable and auditable.</text>

    <g id="legend" transform="translate(1115,34)">
      <line x1="0" y1="8" x2="38" y2="8" class="orange-edge"/>
      <text x="50" y="13" class="label">Worker loop</text>
      <line x1="0" y1="38" x2="38" y2="38" class="purple-edge"/>
      <text x="50" y="43" class="label">Global replan loop</text>
      <line x1="210" y1="8" x2="248" y2="8" class="green-edge"/>
      <text x="260" y="13" class="label">Successful exit</text>
      <line x1="210" y1="38" x2="248" y2="38" class="support-edge"/>
      <text x="260" y="43" class="label">Runtime / persistence</text>
    </g>
  </g>

  <!-- Layer 1: control plane -->
  <g id="layer-1-control-plane">
    <rect x="45" y="112" width="1510" height="460" class="layer"/>
    <text x="70" y="145" class="layer-title" fill="#2563EB">LAYER 1 · LANGGRAPH CONTROL PLANE</text>
    <text x="70" y="168" class="micro">Typed state transitions, parallel fan-out, evidence-driven routing, and two bounded feedback loops</text>

    <!-- Main forward flow connectors -->
    <path d="M190 270 H228" class="blue-edge"/>
    <path d="M338 270 H376" class="blue-edge"/>
    <path d="M506 270 H544" class="blue-edge"/>
    <path d="M914 270 H946" class="blue-edge"/>
    <path d="M1066 270 H1098" class="blue-edge"/>
    <path d="M1238 270 H1270" class="blue-edge"/>
    <path d="M1370 270 H1402" class="green-edge"/>

    <!-- User -->
    <g id="user-question">
      <rect x="70" y="228" width="120" height="84" class="node blue-node"/>
      <text x="130" y="260" text-anchor="middle" class="node-title">Question</text>
      <text x="130" y="284" text-anchor="middle" class="node-body">CLI / resume</text>
    </g>

    <!-- Recon -->
    <g id="reconnaissance">
      <rect x="228" y="228" width="110" height="84" class="node blue-node"/>
      <text x="283" y="260" text-anchor="middle" class="node-title">Recon</text>
      <text x="283" y="284" text-anchor="middle" class="node-body">landscape scan</text>
    </g>

    <!-- Plan -->
    <g id="planning">
      <rect x="376" y="218" width="130" height="104" class="node blue-node"/>
      <text x="441" y="250" text-anchor="middle" class="node-title">Plan</text>
      <text x="441" y="274" text-anchor="middle" class="node-body">coverage contract</text>
      <text x="441" y="295" text-anchor="middle" class="node-body">typed tasks T1…Tn</text>
    </g>

    <!-- Worker wave, detailed -->
    <g id="parallel-worker-wave">
      <rect x="544" y="190" width="370" height="250" rx="14" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
      <text x="566" y="218" class="layer-title" fill="#C2410C">PARALLEL WORKER WAVE</text>
      <text x="894" y="218" text-anchor="end" class="micro">T1 · T2 · … · Tn</text>

      <path d="M650 300 H678" class="orange-edge"/>
      <path d="M764 300 H792" class="orange-edge"/>
      <path d="M835 338 C835 390,610 390,610 338" class="orange-edge"/>

      <g id="worker-formulate">
        <rect x="566" y="258" width="84" height="80" class="node orange-node"/>
        <text x="608" y="289" text-anchor="middle" class="node-title">Formulate</text>
        <text x="608" y="313" text-anchor="middle" class="node-body">queries</text>
      </g>
      <g id="worker-retrieve">
        <rect x="678" y="250" width="86" height="96" class="node orange-node"/>
        <text x="721" y="280" text-anchor="middle" class="node-title">Search</text>
        <text x="721" y="304" text-anchor="middle" class="node-body">or follow</text>
        <text x="721" y="323" text-anchor="middle" class="node-body">source</text>
      </g>
      <g id="worker-evidence">
        <rect x="792" y="250" width="100" height="96" class="node orange-node"/>
        <text x="842" y="280" text-anchor="middle" class="node-title">Evidence</text>
        <text x="842" y="304" text-anchor="middle" class="node-body">assess + extract</text>
        <text x="842" y="323" text-anchor="middle" class="node-body">persist</text>
      </g>
      <g id="worker-decision">
        <rect x="675" y="365" width="112" height="54" class="node orange-node"/>
        <text x="731" y="388" text-anchor="middle" class="node-title">Decide</text>
        <text x="731" y="407" text-anchor="middle" class="node-body">search / follow / stop</text>
      </g>
      <text x="566" y="462" class="label" fill="#C2410C">LOOP A · local evidence gap</text>
      <text x="566" y="484" class="micro">Bounded by query budget + max adaptive steps</text>
    </g>

    <!-- Aggregate -->
    <g id="aggregate">
      <rect x="946" y="218" width="120" height="104" class="node blue-node"/>
      <text x="1006" y="250" text-anchor="middle" class="node-title">Aggregate</text>
      <text x="1006" y="274" text-anchor="middle" class="node-body">validate IDs</text>
      <text x="1006" y="295" text-anchor="middle" class="node-body">task statuses</text>
    </g>

    <!-- Audit -->
    <g id="audit-coordinator">
      <rect x="1098" y="208" width="140" height="124" class="node blue-node"/>
      <text x="1168" y="239" text-anchor="middle" class="node-title">Audit</text>
      <text x="1168" y="264" text-anchor="middle" class="node-body">single or layered</text>
      <text x="1168" y="285" text-anchor="middle" class="node-body">claims + conflicts</text>
      <text x="1168" y="306" text-anchor="middle" class="node-body">actionable gaps</text>
    </g>

    <!-- Deterministic gate -->
    <g id="sufficiency-gates">
      <path d="M1320 210 L1370 270 L1320 330 L1270 270 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
      <text x="1320" y="252" text-anchor="middle" class="node-title">Gates</text>
      <text x="1320" y="274" text-anchor="middle" class="node-body">coverage</text>
      <text x="1320" y="293" text-anchor="middle" class="node-body">sources · tasks</text>
    </g>

    <!-- Report exit -->
    <g id="report">
      <rect x="1402" y="228" width="120" height="84" class="node green-node"/>
      <text x="1462" y="260" text-anchor="middle" class="node-title">Report</text>
      <text x="1462" y="284" text-anchor="middle" class="node-body">audited evidence</text>
      <text x="1387" y="251" text-anchor="end" class="label" fill="#047857">PASS</text>
    </g>

    <!-- Global replan branch -->
    <path d="M1320 330 V386 H1206" class="purple-edge"/>
    <g id="research-supervisor-replan">
      <rect x="1038" y="360" width="168" height="92" class="node purple-node"/>
      <text x="1122" y="390" text-anchor="middle" class="node-title">Supervisor Replan</text>
      <text x="1122" y="414" text-anchor="middle" class="node-body">append targeted tasks</text>
      <text x="1122" y="434" text-anchor="middle" class="node-body">dispatch only new wave</text>
    </g>
    <path d="M1038 406 C960 406,940 520,760 520 H520 V315 H544" class="purple-edge"/>
    <text x="1246" y="378" class="label" fill="#6D28D9">FAIL + rounds remain</text>
    <text x="830" y="542" class="label" fill="#6D28D9">LOOP B · global coverage gap</text>

    <!-- Terminal fail branch -->
    <path d="M1320 330 V492 H1458 V312" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-neutral)"/>
    <text x="1334" y="474" class="micro">limit reached → report with explicit gaps</text>
  </g>

  <!-- Layer 2: execution -->
  <g id="layer-2-execution">
    <rect x="90" y="610" width="1420" height="170" class="layer"/>
    <text x="116" y="644" class="layer-title" fill="#475569">LAYER 2 · CACHED EXECUTION &amp; INTEGRATIONS</text>
    <text x="116" y="666" class="micro">A single runtime boundary gives every model, search, extraction, and assessment call a stable operation signature.</text>

    <path d="M330 713 H438" class="neutral-edge"/>
    <path d="M692 713 H800" class="neutral-edge"/>
    <path d="M1054 713 H1162" class="neutral-edge"/>

    <g id="research-runtime">
      <rect x="116" y="684" width="214" height="58" class="node blue-node"/>
      <text x="223" y="708" text-anchor="middle" class="node-title">ResearchRuntime</text>
      <text x="223" y="729" text-anchor="middle" class="node-body">cache keys · retries · typed contracts</text>
    </g>
    <g id="model-gateway">
      <rect x="438" y="684" width="254" height="58" class="node gray-node"/>
      <text x="565" y="708" text-anchor="middle" class="node-title">Model Gateway</text>
      <text x="565" y="729" text-anchor="middle" class="node-body">route · budget · retry · token accounting</text>
    </g>
    <g id="retrieval-stack">
      <rect x="800" y="684" width="254" height="58" class="node gray-node"/>
      <text x="927" y="708" text-anchor="middle" class="node-title">Retrieval Stack</text>
      <text x="927" y="729" text-anchor="middle" class="node-body">Tavily · full-page extract · local BM25</text>
    </g>
    <g id="source-evaluator">
      <rect x="1162" y="684" width="222" height="58" class="node gray-node"/>
      <text x="1273" y="708" text-anchor="middle" class="node-title">Source Evaluator</text>
      <text x="1273" y="729" text-anchor="middle" class="node-body">quality · directness · eligibility</text>
    </g>

    <path d="M729 572 V606 H223 V684" class="support-edge"/>
    <path d="M1168 572 V592 H565 V684" class="support-edge"/>
  </g>

  <!-- Layer 3: durable state -->
  <g id="layer-3-durable-state">
    <rect x="145" y="820" width="1310" height="112" class="layer"/>
    <text x="170" y="852" class="layer-title" fill="#475569">LAYER 3 · DURABLE STATE &amp; OBSERVABILITY</text>

    <g id="checkpoint-store">
      <rect x="170" y="872" width="332" height="40" class="node gray-node"/>
      <text x="336" y="897" text-anchor="middle" class="node-title">checkpoints.sqlite · graph position + resume</text>
    </g>
    <g id="evidence-ledger">
      <rect x="520" y="872" width="466" height="40" class="node gray-node"/>
      <text x="753" y="897" text-anchor="middle" class="node-title">research.sqlite · tasks + sources + evidence + audits</text>
    </g>
    <g id="gateway-telemetry">
      <rect x="1004" y="872" width="426" height="40" class="node gray-node"/>
      <text x="1217" y="897" text-anchor="middle" class="node-title">model_gateway.sqlite · usage + cost + latency + errors</text>
    </g>

    <path d="M223 780 V872" class="support-edge"/>
    <path d="M927 780 V842 H753 V872" class="support-edge"/>
    <path d="M565 780 V832 H1217 V872" class="support-edge"/>
  </g>

  <text x="800" y="958" text-anchor="middle" class="subtitle">Loop A changes the next evidence action. Loop B changes the research plan. Both are bounded by deterministic state and hard limits.</text>
</svg>
