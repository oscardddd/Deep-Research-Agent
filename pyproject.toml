[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-deep-research"
version = "0.1.0"
description = "A budget-bounded, evidence-first deep research MVP"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
benchmark = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.28",
  "tqdm>=4.65",
]

[project.scripts]
deep-research = "deepresearch.cli:main"
deep-research-benchmark = "deepresearch.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
